spring.application.name=demo

# --- PostgreSQL connection ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DB_NAME:orderdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# --- JPA / Hibernate ---
# "update" = Hibernate auto-creates/alters tables to match your entities on startup.
# Good for development. In production you'd use "validate" + migration tools like Flyway.
spring.jpa.hibernate.ddl-auto=update
# Print SQL statements to the console so you can see what Hibernate generates
spring.jpa.show-sql=true

# --- Kafka ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer: serialize both key and value as plain Strings.
# We send pre-serialized JSON from the outbox, so no need for JsonSerializer.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer: deserialize both key and value as plain Strings.
# Consumers manually parse JSON with ObjectMapper — gives us explicit control
# over deserialization and avoids type-header coupling between producer and consumer.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# --- Actuator & Kubernetes Health Checks ---
# Enable all monitoring endpoints
management.endpoints.web.exposure.include=health,info

# Ensure the health endpoint reports status upon startup
management.endpoint.health.show-details=always

# Enable endpoints required for K8s liveness and readiness probes
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Force liveness and readiness endpoints to operate independently, decoupled from database and Kafka status
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState